<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Now Playing — Untuk Kamu 💌</title>
<link rel="stylesheet" href="styles.css">
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at center, #4a4a4a 0%, #1c1c1c 70%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 24px;
  }

  .widget {
    width: 320px;
    background: rgba(30, 30, 30, 0.85);
    backdrop-filter: blur(10px);
    border-radius: 28px;
    padding: 18px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.45);
    color: #fff;
  }

  .album-art {
    width: 100%;
    aspect-ratio: 1 / 1;
    border-radius: 14px;
    background-image: url('pho1.jpeg');
    background-size: cover;
    background-position: center;
    margin-bottom: 14px;
  }

  /* Slightly transparent header for music page */
  .page-header.music {
    background: rgba(20,7,12,0.28);
    border-bottom: none;
    position: absolute;
    top: 18px;
    left: 18px;
    right: 18px;
    padding: 10px 16px;
    border-radius: 12px;
    max-width: calc(100% - 36px);
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 30;
    backdrop-filter: blur(6px);
  }

  .page-header.music .site-nav a { color: rgba(255,255,255,0.9); }

  .device-label {
    font-size: 13px;
    color: #a0a0a0;
    margin-bottom: 4px;
  }

  .track-title {
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 2px;
  }

  .track-artist {
    font-size: 14px;
    color: #b0b0b0;
    margin-bottom: 12px;
  }

  .progress-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
  }

  .time {
    font-size: 12px;
    color: #b0b0b0;
    min-width: 34px;
  }

  .progress-bar {
    flex: 1;
    height: 4px;
    background: #565656;
    border-radius: 2px;
    position: relative;
    overflow: hidden;
  }

  .progress-fill {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 0%;
    background: #d9d9d9;
    border-radius: 2px;
    transition: width .2s linear;
  }

  .controls {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 16px 6px 18px;
  }

  .controls button {
    background: none;
    border: none;
    color: #fff;
    cursor: pointer;
    padding: 0;
  }

  .airplay { color: #b0b0b0; }

  .volume-row {
    display: flex;
    align-items: center;
    gap: 10px;
    color: #b0b0b0;
  }

  .volume-bar {
    flex: 1;
    height: 4px;
    background: #565656;
    border-radius: 2px;
    position: relative;
  }

  .volume-fill {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 55%;
    background: #d9d9d9;
    border-radius: 2px;
  }
</style>
</head>
<body>
<div class="widget">

<header class="page-header music">
  <div class="site-brand">Untuk Kamu 💌</div>
  <nav class="site-nav">
    <a href="index.html">Home</a>
    <a href="music.html">Music</a>
  </nav>
</header>

<div style="height:14px"></div>

<div class="widget">
  <div class="album-art" id="albumArt"></div>

  <div class="device-label">iPhone</div>
  <div class="track-title" id="trackTitle">I Wanna Be Yours</div>
  <div class="track-artist" id="trackArtist">Arctic Monkeys</div>

  <div class="progress-row">
    <span class="time" id="currentTime">0:00</span>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <span class="time" id="remainingTime">-0:00</span>
  </div>

  <div class="controls">
    <button id="prevBtn" aria-label="Prev"><svg width="24" height="24" viewBox="0 0 24 24" fill="white"><path d="M11 18V6l-8.5 6 8.5 6zm.5-6l8.5 6V6l-8.5 6z"/></svg></button>
    <button id="playBtn" aria-label="Play"><svg width="32" height="32" viewBox="0 0 24 24" fill="white" id="playIcon"><path d="M8 5v14l11-7z"/></svg></button>
    <button id="nextBtn" aria-label="Next"><svg width="24" height="24" viewBox="0 0 24 24" fill="white"><path d="M13 6v12l8.5-6L13 6zM4 6v12l8.5-6L4 6z"/></svg></button>
    <button class="airplay" id="airplayBtn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 15c5-5 15-5 20 0M5.5 11.5c3.5-3.3 9.5-3.3 13 0M9 8c2-1.8 4-1.8 6 0"/><path d="M12 15l4 5H8l4-5z" fill="currentColor" stroke="none"/></svg></button>
  </div>

  <div class="volume-row">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3z"/></svg>
    <div class="volume-bar"><div class="volume-fill" id="volumeFill"></div></div>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3z"/><path d="M16 8a5 5 0 010 8" stroke="currentColor" stroke-width="1.5" fill="none"/></svg>
  </div>

  <audio id="audio" preload="metadata" src="sempurna.mp3"></audio>
</div>

<script>
  // Playlist-enabled widget: keeps the compact UI but supports multiple tracks
  const playlist = [
    { title: "Sempurna", artist: "Andra & the Backbone", src: "sempurna.mp3", cover: "pho1.jpeg" },
    { title: "Lagu 2", artist: "Artis 2", src: "", cover: "pho2.jpeg" },
    { title: "Lagu 3", artist: "Artis 3", src: "", cover: "pho3.jpeg" },
    { title: "Lagu 4", artist: "Artis 4", src: "", cover: "pho4.jpeg" },
    { title: "Lagu 5", artist: "Artis 5", src: "", cover: "pho5.jpeg" },
    { title: "Lagu 6", artist: "Artis 6", src: "", cover: "pho6.jpeg" },
    { title: "Lagu 7", artist: "Artis 7", src: "", cover: "pho7.jpeg" },
    { title: "Lagu 8", artist: "Artis 8", src: "", cover: "pho8.jpeg" },
    { title: "Lagu 9", artist: "Artis 9", src: "", cover: "pho9.jpeg" },
    { title: "Lagu 10", artist: "Artis 10", src: "", cover: "pho10.jpeg" }
  ];

  let currentIndex = 0;
  const audio = document.getElementById('audio');
  const playBtn = document.getElementById('playBtn');
  const playIcon = document.getElementById('playIcon').querySelector('path');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const currentTimeEl = document.getElementById('currentTime');
  const remainingTimeEl = document.getElementById('remainingTime');
  const progressFill = document.getElementById('progressFill');
  const albumArt = document.getElementById('albumArt');
  const trackTitle = document.getElementById('trackTitle');
  const trackArtist = document.getElementById('trackArtist');

  const playPath = 'M8 5v14l11-7z';
  const pausePath = 'M6 5h4v14H6zM14 5h4v14h-4z';

  function formatTime(sec){ if (!isFinite(sec) || isNaN(sec)) return '0:00'; const m=Math.floor(sec/60); const s=Math.floor(sec%60).toString().padStart(2,'0'); return `${m}:${s}` }

  function trySetArtByCandidates(el, candidates){
    let i=0;
    function next(){ if(i>=candidates.length) return; const u=candidates[i++]; const img=new Image(); img.onload=()=>{ el.style.backgroundImage = `url(${u})`; }; img.onerror=next; img.src=u }
    next();
  }

  function setAlbumArt(track, index){
    const candidates = [];
    if (track.cover) candidates.push(track.cover);
    candidates.push(`pho${index+1}.jpeg`, `pho${index+1}.jpg`, `${index+1}.jpeg`, `${index+1}.jpg`, `cover${index+1}.jpg`, `cover${index+1}.jpeg`, `cover${index+1}.png`);
    trySetArtByCandidates(albumArt, candidates);
  }

  function loadTrack(index, autoplay=false){
    currentIndex = (index + playlist.length) % playlist.length;
    const t = playlist[currentIndex];
    trackTitle.textContent = t.title || 'Unknown';
    trackArtist.textContent = t.artist || '';
    audio.src = t.src || '';
    progressFill.style.width = '0%';
    currentTimeEl.textContent = '0:00';
    remainingTimeEl.textContent = '-0:00';
    setAlbumArt(t, currentIndex);
    if (autoplay && audio.src){ audio.play().catch(()=>{}); }
  }

  playBtn.addEventListener('click', () => {
    if (!audio.src){ // if no src, just show next track
      loadTrack(currentIndex + 1, true);
      return;
    }
    if (audio.paused) audio.play(); else audio.pause();
  });

  audio.addEventListener('play', () => playIcon.setAttribute('d', pausePath));
  audio.addEventListener('pause', () => playIcon.setAttribute('d', playPath));

  audio.addEventListener('timeupdate', () => {
    if (!audio.duration) return;
    const pct = (audio.currentTime / audio.duration) * 100;
    progressFill.style.width = pct + '%';
    currentTimeEl.textContent = formatTime(audio.currentTime);
    remainingTimeEl.textContent = '-' + formatTime(audio.duration - audio.currentTime);
  });

  audio.addEventListener('ended', () => loadTrack(currentIndex + 1, true));

  prevBtn.addEventListener('click', () => loadTrack(currentIndex - 1, true));
  nextBtn.addEventListener('click', () => loadTrack(currentIndex + 1, true));

  // initial
  loadTrack(0, false);
</script>
</body>
</html>
